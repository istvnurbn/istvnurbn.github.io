baseURL: "https://istvnurbn.me/"
title: istvn.urbn
theme: PaperMod

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
titleCaseStyle: none

params:
  env: production
  mainSections: ["posts"]
  title: istvn.urbn
  description: Personal & opinionated blog of István Urbán
  author: István Urbán
  images:
    - images/cover.jpg
  DateFormat: "January 2, 2006"
  defaultTheme: light
  disableThemeToggle: true

  social:
    fediverse_creator: "@istvnurbn@mastodon.social"

  ShowReadingTime: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowPageNums: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  disableSpecial1stPost: true
  comments: false

  assets:
    favicon: favicon.svg

  label:
    text: "istvn.urbn"
    icon: images/icon.svg
    iconHeight: 35

  profileMode:
    enabled: true
    title: István Urbán
    subtitle: |
      Hi there :wave:

      This is my internet home.

      Views and typos my own.
    imageUrl: images/profile.jpg
    imageTitle: Yeah, that's me...
    imageWidth: 150
    imageHeight: 150

  socialIcons:
    - name: "github"
      url: "https://www.github.com/istvnurbn"
    - name: "mastodon"
      url: "https://mastodon.social/@istvnurbn"
    - name: "instagram"
      url: "https://www.instagram.com/istvn_urbn/"

  cover:
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/istvnurbn/istvnurbn.github.io/blob/main/content"
    Text: "suggest changes"
    appendFilePath: true

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: archives
      url: /archives/
      weight: 20
    - identifier: tags
      name: tags
      url: /tags/
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 40
    - identifier: search
      name: search
      url: /search/
      weight: 50

taxonomies:
  tag: tags

permalinks:
  page:
    posts: /:year/:month/:title/

pagination:
  pagerSize: 7

markup:
  goldmark:
    renderer:
      unsafe: true
